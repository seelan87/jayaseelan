name: Build Windows x64 EXE

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-x64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
            constraints-win64-py312.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check the source application
        run: python launcher.py --self-test test-results/source.json
      - name: Build and test portable and single-file executables
        run: python tools/build_windows.py --mode both
      - name: Upload Windows x64 downloads
        uses: actions/upload-artifact@v7
        with:
          name: MuMax3-Image-Tools-windows-x64
          path: release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Windows-x64-test-reports
          path: |
            test-results/*.json
            release/self-test-*.json
            build/**/warn-*.txt
          if-no-files-found: warn
